services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loomhash}
      POSTGRES_USER: ${POSTGRES_USER:-loomhash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Bound to the VPS's own loopback only -- not reachable from outside the
    # VPS. Reach it from another machine via an SSH tunnel, not by opening
    # this port. See deploy/README.md.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loomhash} -d ${POSTGRES_DB:-loomhash}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass: Redis has no auth by default -- an unauthenticated Redis
    # reachable from the network is a common breach vector. Never remove
    # this even though the port is also loopback-only (defense in depth).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      # Only so the healthcheck below can read it inside the container;
      # the actual auth password comes from the command above.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_CONNINFO: "postgresql://${POSTGRES_USER:-loomhash}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loomhash}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
