version: "3.8"

services:
  # The Database
  postgres:
    image: postgres:16-alpine
    container_name: loomhash-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loomhash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-loomhash}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loomhash}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Cache
  redis:
    image: redis:7-alpine
    container_name: loomhash-redis
    command: ${REDIS_PASSWORD:+redis-server --requirepass $REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Backend API Gateway
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loomhash-api
    environment:
      # Use the container names as the host for internal resolution
      POSTGRES_CONNINFO: "postgresql://${POSTGRES_USER:-loomhash}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-loomhash}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The Developer Dashboard (React SPA + Nginx)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: loomhash-dashboard
    ports:
      - "${DASHBOARD_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
