[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loomhash"
version = "0.0.0"
description = "Self-hosted zero-knowledge biometric microservice (feasibility prototype). See system.md and docs/."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.27",
    "onnxruntime>=1.17",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
]

# requires-python enforces system.md constraint 2 (int.bit_count() availability).
# numpy, fastapi, and uvicorn are spec-mandated (system.md section 3/4). psycopg
# and redis were approved explicitly by the user on 2026-09-17 for the storage
# module's PostgreSQL/Redis adapters (see STATUS.md and docs/open-decisions.md
# D-10) -- neither has been tested against a live PostgreSQL/Redis instance in
# this environment yet. httpx is a test-only dependency required by FastAPI's
# TestClient (fastapi.testclient.TestClient) to exercise the API routes in
# tests/test_api/ without a running server. fastapi's floor is 0.115 (pulling
# in a newer starlette) because fastapi 0.110's bundled starlette 0.36 built
# TestClient against an httpx `app=` argument that httpx>=0.28 removed. No
# other dependency is approved; add further ones only with explicit user
# consent.

[tool.setuptools.packages.find]
include = ["loomhash*"]
