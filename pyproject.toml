[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loomhash"
version = "0.0.0"
description = "Self-hosted zero-knowledge biometric microservice (feasibility prototype). See system.md and docs/."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
]

# requires-python enforces system.md constraint 2 (int.bit_count() availability).
# numpy is spec-mandated (system.md section 3: "Native Python numpy for seeded
# LSH projection"). psycopg and redis were approved explicitly by the user on
# 2026-09-17 for the storage module's PostgreSQL/Redis adapters (see
# STATUS.md and docs/open-decisions.md D-10) -- neither has been tested
# against a live PostgreSQL/Redis instance in this environment yet. No other
# dependency is approved; add further ones only with explicit user consent.

[tool.setuptools.packages.find]
include = ["loomhash*"]
